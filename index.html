    <div class="days" id="days" role="group" aria-label="День недели"></div>

    <!-- БЛОК 3: расписание на день -->
    <h2 class="day-title" id="dayTitle"></h2>
    <ul class="schedule" id="schedule"></ul>

    <!-- БЛОК 4: поиск -->
    <section class="search" aria-labelledby="searchTitle">
      <h2 id="searchTitle">Найти урок по теме</h2>
      <input type="search" id="searchInput" placeholder="Например: площадь, Крылов, корень" aria-label="Слово из темы урока">
      <div class="chips" id="searchChips" role="group" aria-label="Предмет"></div>
      <p class="hint" id="searchHint"></p>
      <ul class="schedule" id="searchResults"></ul>
    </section>
  </main>
</div>

<!-- БЛОК 5–6: окно урока -->
<dialog class="lesson" id="lessonDialog" aria-labelledby="dTopic">
  <div class="d-inner">
    <div class="d-head">
      <div>
        <div class="d-subject" id="dSubject"></div>
        <div class="d-when" id="dWhen"></div>
      </div>
      <button type="button" class="d-close" id="dClose" aria-label="Закрыть">×</button>
    </div>
    <h2 class="d-topic" id="dTopic"></h2>

    <h3>Краткий конспект</h3>
    <p class="d-text" id="dSummary"></p>

    <h3 id="dMaterialsTitle">Материалы</h3>
    <ul class="d-materials" id="dMaterials"></ul>

    <h3>Домашнее задание</h3>
    <p class="d-text d-homework" id="dHomework"></p>

    <div class="d-saved-note" id="dSavedNote" hidden>
      <h3>Заметка об уроке</h3>
      <p class="d-text" id="dSavedNoteText"></p>
    </div>
    <p class="d-who" id="dWho" hidden></p>

    <div class="d-actions">
      <button type="button" class="btn primary" id="dDone"></button>
      <button type="button" class="btn" id="dNoteToggle"></button>
    </div>
    <div class="d-note" id="dNoteBox" hidden>
      <textarea id="dNoteText" aria-label="Заметка об уроке" placeholder="Как прошёл урок, что не успели"></textarea>
      <button type="button" class="btn primary" id="dNoteSave">Сохранить заметку</button>
    </div>
    <p class="d-msg" id="dMsg" role="status"></p>
  </div>
</dialog>

<script>
  // ---------- Какая программа открыта: 8.2 (основная) или 8.3 ----------
  // Страница 8.3 открывается по адресу с #8.3 в конце. Расписание то же,
  // содержание уроков из листа «Уроки 8.3», отметки свои (начинаются с «8.3|»).
  const IS83 = location.hash === "#8.3";
  const PREFIX = IS83 ? "8.3|" : "";
  const SUFFIX = IS83 ? "-8.3" : "";
  const LIST = IS83
    ? LESSONS.map(function (l) { return { date: l.date, subject: l.subject, topic: "", summary: "", homework: "", konspekt: "", prezentaciya: "", list: "" }; })
    : LESSONS;
  document.getElementById(IS83 ? "prog83" : "prog82").setAttribute("aria-current", "page");
  if (IS83) document.title = "3 класс. Программа 8.3";
  window.addEventListener("hashchange", function () { location.reload(); });

  const SUBJ_CLASS = { "Русский язык": "rus", "Математика": "mat", "Чтение": "cht", "Окружающий мир": "okr" };
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const MONTHS_SHORT = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  const WD_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const WD_FULL = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function parseDate(s) {
    const p = String(s).split(".").map(Number);
    return new Date(YEAR, p[1] - 1, p[0]);
  }
  function keyOf(d) { return d.getDate() + "." + (d.getMonth() + 1); }
  function dayId(l) { return keyOf(parseDate(l.date)) + "|" + l.subject; }
  function lessonId(l) { return PREFIX + dayId(l); }
  function sameDay(a, b) { return a.getTime() === b.getTime(); }

  // ---------- Отметки и заметки (хранятся на этом устройстве) ----------
  const STORE_KEY = "sayt-uroki-otmetki" + SUFFIX;
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { marks = {}; }
  function saveMarks() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(marks)); return true; }
    catch (e) { return false; }
  }
  function markOf(l) { return marks[lessonId(l)] || {}; }

  // ---------- Уроки и недели ----------
  const byId = {};
  LIST.forEach(function (l) { byId[dayId(l)] = l; });

  // ---------- Содержание уроков из листа «Уроки» Google-таблицы ----------
  // Заполненная ячейка таблицы заменяет то, что записано в этом файле.
  const BASE = LIST.map(function (l) { return Object.assign({}, l); });
  const FIELDS = ["topic", "summary", "homework", "konspekt", "prezentaciya", "list"];
  const LESSONS_KEY = "sayt-uroki-uroki" + SUFFIX;
  function applyLessons(rows) {
    if (!Array.isArray(rows)) return false;
    const fromSheet = {};
    rows.forEach(function (r) {
      const p = /(\d{1,2})\.(\d{1,2})/.exec(String(r && r.date || ""));
      if (p) fromSheet[Number(p[1]) + "." + Number(p[2]) + "|" + String(r.subject || "").trim()] = r;
    });
    LIST.forEach(function (l, i) {
      const r = fromSheet[dayId(l)] || {};
      FIELDS.forEach(function (f) { l[f] = String(r[f] || "").trim() || BASE[i][f]; });
    });
    return true;
  }
  try { applyLessons(JSON.parse(localStorage.getItem(LESSONS_KEY))); } catch (e) {}

  const START = parseDate(PERIOD.from), END = parseDate(PERIOD.to);
  const weeks = [];
  (function () {
    const mon = new Date(START);
    mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    while (mon <= END) {
      const days = [];
      for (let i = 0; i < 5; i++) {
        const d = new Date(mon);
        d.setDate(mon.getDate() + i);
        days.push({ date: d, inPeriod: d >= START && d <= END });
      }
      if (days.some(function (x) { return x.inPeriod; })) weeks.push(days);
      mon.setDate(mon.getDate() + 7);
    }
  })();

  let selWeek = 0, selDay = null;
  function firstDayOf(w) { return weeks[w].find(function (x) { return x.inPeriod; }).date; }
  function selectDate(d) {
    weeks.forEach(function (days, w) {
      days.forEach(function (x) { if (x.inPeriod && sameDay(x.date, d)) { selWeek = w; selDay = x.date; } });
    });
  }
  (function () {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    selDay = firstDayOf(0);
    if (today > END) { selWeek = weeks.length - 1; selDay = weeks[selWeek].filter(function (x) { return x.inPeriod; }).pop().date; }
    else selectDate(today);
  })();

  // ---------- БЛОК 1: счётчик ----------
  function renderProgress() {
    const done = LIST.filter(function (l) { return markOf(l).done; }).length;
    document.getElementById("progressCount").textContent = "Проведено " + done + " из " + LIST.length;
    document.getElementById("progressBar").style.width = (LIST.length ? done / LIST.length * 100 : 0) + "%";
  }

  // ---------- БЛОК 2: недели и дни ----------
  function weekLabel(days) {
    const a = days[0].date, b = days[4].date;
    if (a.getMonth() === b.getMonth()) return a.getDate() + "–" + b.getDate() + " " + MONTHS[a.getMonth()];
    return a.getDate() + " " + MONTHS_SHORT[a.getMonth()] + " – " + b.getDate() + " " + MONTHS_SHORT[b.getMonth()];
  }
  function renderWeeks() {
    const box = document.getElementById("weeks");
    box.textContent = "";
    weeks.forEach(function (days, w) {
      const b = el("button", "", weekLabel(days));
      b.type = "button";
      b.setAttribute("aria-pressed", w === selWeek ? "true" : "false");
      b.onclick = function () { selWeek = w; selDay = firstDayOf(w); renderAll(); };
      box.appendChild(b);
    });
  }
  function renderDays() {
    const box = document.getElementById("days");
    box.textContent = "";
    weeks[selWeek].forEach(function (x) {
      const b = el("button");
      b.type = "button";
      b.appendChild(el("small", "", WD_SHORT[x.date.getDay()]));
      b.appendChild(el("b", "", x.date.getDate()));
      b.disabled = !x.inPeriod;
      b.setAttribute("aria-pressed", sameDay(x.date, selDay) ? "true" : "false");
      b.setAttribute("aria-label", WD_FULL[x.date.getDay()] + ", " + x.date.getDate() + " " + MONTHS[x.date.getMonth()]);
      b.onclick = function () { selDay = x.date; renderAll(); };
      box.appendChild(b);
    });
  }

  // ---------- БЛОК 3: расписание на день ----------
  function renderSchedule() {
    document.getElementById("dayTitle").textContent =
      WD_FULL[selDay.getDay()] + ", " + selDay.getDate() + " " + MONTHS[selDay.getMonth()];
    const list = document.getElementById("schedule");
    list.textContent = "";
    const slots = TIMETABLE[selDay.getDay()] || [];
    slots.forEach(function (subject, i) {
      if (!subject) return;
      const lesson = byId[keyOf(selDay) + "|" + subject];
      const li = el("li");
      const row = el(lesson ? "button" : "div", "row " + (lesson ? SUBJ_CLASS[subject] || "" : "off"));
      const when = el("div", "when");
      when.appendChild(el("b", "", i + 1));
      when.appendChild(document.createTextNode(TIMES[i] || ""));
      const body = el("div");
      body.appendChild(el("div", "subject", subject));
      if (lesson) {
        row.type = "button";
        body.appendChild(el("div", "topic", lesson.topic || "Тема пока не заполнена"));
        const m = markOf(lesson);
        if (m.done || m.note) {
          const st = el("div", "status");
          if (m.done) st.appendChild(el("span", "is-done", "✓ Проведён"));
          if (m.note) st.appendChild(el("span", "", "Есть заметка"));
          body.appendChild(st);
        }
        row.onclick = function () { openLesson(lesson); };
      }
      row.appendChild(when);
      row.appendChild(body);
      li.appendChild(row);
      list.appendChild(li);
    });
  }

  // ---------- БЛОК 4: поиск ----------
  let searchSubject = "";
  const searchInput = document.getElementById("searchInput");
  searchInput.oninput = function () { renderSearch(); };

  function renderSearch() {
    const chips = document.getElementById("searchChips");
    chips.textContent = "";
    [""].concat(Object.keys(SUBJ_CLASS)).forEach(function (s) {
      const b = el("button", "", s || "Все предметы");
      b.type = "button";
      b.setAttribute("aria-pressed", s === searchSubject ? "true" : "false");
      b.onclick = function () { searchSubject = s; renderSearch(); };
      chips.appendChild(b);
    });

    const q = searchInput.value.trim().toLowerCase();
    const hint = document.getElementById("searchHint");
    const list = document.getElementById("searchResults");
    list.textContent = "";
    if (!q && !searchSubject) { hint.textContent = "Введите слово из темы или выберите предмет."; return; }

    const found = LIST.filter(function (l) {
      return (!searchSubject || l.subject === searchSubject) &&
             (!q || (l.topic || "").toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) { return parseDate(a.date) - parseDate(b.date); });

    hint.textContent = found.length ? "Найдено уроков: " + found.length : "Ничего не найдено. Попробуйте другое слово.";
    found.forEach(function (l) {
      const d = parseDate(l.date);
      const li = el("li");
      const row = el("button", "row " + (SUBJ_CLASS[l.subject] || ""));
      row.type = "button";
      const when = el("div", "when");
      when.appendChild(el("b", "", d.getDate() + "." + (d.getMonth() + 1)));
      when.appendChild(document.createTextNode(WD_SHORT[d.getDay()]));
      const body = el("div");
      body.appendChild(el("div", "subject", l.subject));
      body.appendChild(el("div", "topic", l.topic || "Тема пока не заполнена"));
      const m = markOf(l);
      if (m.done || m.note) {
        const st = el("div", "status");
        if (m.done) st.appendChild(el("span", "is-done", "✓ Проведён"));
        if (m.note) st.appendChild(el("span", "", "Есть заметка"));
        body.appendChild(st);
      }
      row.onclick = function () { openLesson(l); };
      row.appendChild(when);
      row.appendChild(body);
      li.appendChild(row);
      list.appendChild(li);
    });
  }

  // ---------- БЛОК 5–6: окно урока ----------
  const dlg = document.getElementById("lessonDialog");
  let current = null;
  const $ = function (id) { return document.getElementById(id); };

  // Картинка в конспекте: отдельная строка вида [картинка: imya-fajla.png].
  // Сам файл лежит в папке kartinki рядом с index.html.
  // Нажатие на картинку открывает её крупно.
  const IMG_TAG = /\[картинка:\s*([A-Za-z0-9._-]+\.(?:png|jpe?g|gif|webp))\s*\]\n?/gi;
  function makeImage(name) {
    const img = document.createElement("img");
    img.className = "d-img";
    img.src = "kartinki/" + name;
    img.alt = "Картинка к конспекту (нажмите, чтобы открыть крупно)";
    img.addEventListener("click", function () { window.open(img.src, "_blank"); });
    img.addEventListener("error", function () {
      img.replaceWith(document.createTextNode("(картинка «" + name + "» не загрузилась)\n"));
    });
    return img;
  }
  function setText(node, text) {
    node.textContent = "";
    node.classList.toggle("empty", !text);
    if (!text) { node.textContent = "Пока не заполнено"; return; }
    let last = 0, m;
    IMG_TAG.lastIndex = 0;
    while ((m = IMG_TAG.exec(text))) {
      if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      node.appendChild(makeImage(m[1]));
      last = IMG_TAG.lastIndex;
    }
    if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
  }
  // «Отпечаток» того, что показано в окне: содержание урока и отметка.
  // По нему видно, изменилось ли что-то после ответа таблицы.
  let shownLesson = "", shownMark = "";
  function lessonPrint(l) { return JSON.stringify(FIELDS.map(function (f) { return l[f] || ""; })); }
  function markPrint(l) { const m = markOf(l); return JSON.stringify([!!m.done, m.note || "", m.who || "", m.when || ""]); }
  // Открытое окно обновляется само, когда из таблицы пришло новое.
  // Если ничего не изменилось, окно не трогаем: картинки не мигают.
  function refreshDialog() {
    if (!dlg.open || !current) return;
    const lessonChanged = lessonPrint(current) !== shownLesson;
    if (!lessonChanged && markPrint(current) === shownMark) return;
    const top = dlg.scrollTop;
    fillDialog();
    dlg.scrollTop = top;
    if (lessonChanged) $("dMsg").textContent = "Урок обновлён: в таблице появились изменения.";
  }
  function fillDialog() {
    const l = current, d = parseDate(l.date), m = markOf(l);
    shownLesson = lessonPrint(l);
    shownMark = markPrint(l);
    const slot = (TIMETABLE[d.getDay()] || []).indexOf(l.subject);
    dlg.className = "lesson " + (SUBJ_CLASS[l.subject] || "");
    $("dSubject").textContent = l.subject;
    $("dWhen").textContent = WD_FULL[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] +
      (slot >= 0 ? " · " + (slot + 1) + " урок, " + TIMES[slot] : "");
    $("dTopic").textContent = l.topic || "Тема пока не заполнена";
    setText($("dSummary"), l.summary);
    setText($("dHomework"), l.homework);

    const mats = $("dMaterials");
    mats.textContent = "";
    // «не нужно» (или «нет», «-») в ячейке ссылки: строка не показывается.
    // Если не нужны оба материала, прячется и заголовок «Материалы».
    const NOT_NEEDED = /^(не\s*нужн[оаы]?|нет|[-–—])$/i;
    [["Презентация", l.prezentaciya], ["Рабочий лист", l.list]].forEach(function (p) {
      if (NOT_NEEDED.test(String(p[1] || "").trim())) return;
      const li = el("li");
      if (/^https?:\/\//i.test(p[1] || "")) {
        const a = el("a", "", p[0]);
        a.href = p[1]; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
        li.appendChild(el("span", "none", "открыть"));
      } else {
        li.appendChild(el("span", "", p[0]));
        li.appendChild(el("span", "none", "пока нет ссылки"));
      }
      mats.appendChild(li);
    });
    mats.hidden = $("dMaterialsTitle").hidden = !mats.children.length;

    $("dSavedNote").hidden = !m.note;
    $("dSavedNoteText").textContent = m.note || "";
    $("dWho").hidden = !m.who;
    $("dWho").textContent = m.who ? "Последнее изменение: " + m.who + (m.when ? ", " + m.when : "") : "";
    $("dDone").textContent = m.done ? "✓ Проведён (снять отметку)" : "Урок проведён";
    $("dDone").setAttribute("aria-pressed", m.done ? "true" : "false");
    $("dNoteToggle").textContent = m.note ? "Изменить заметку" : "Оставить заметку";
  }
  function updateMark(change) {
    const id = lessonId(current);
    const m = Object.assign({}, marks[id], change);
    if (SHARED) {
      m.who = whoAmI(true);
      m.when = "";
      queue[id] = { done: !!m.done, note: m.note || "", who: m.who, t: Date.now() };
      saveQueue();
    }
    if (!m.done && !m.note) delete marks[id]; else marks[id] = m;
    const ok = saveMarks();
    if (SHARED) sync();
    fillDialog();
    renderAll();
    return ok;
  }
  const SAVE_FAIL = "Не удалось сохранить: браузер запретил хранение на этом устройстве.";

  function openLesson(lesson) {
    current = lesson;
    $("dNoteBox").hidden = true;
    $("dMsg").textContent = "";
    fillDialog();
    dlg.showModal();
    dlg.scrollTop = 0;
    sync(); // сразу спросить таблицу, нет ли свежего текста урока
  }
  $("dClose").onclick = function () { dlg.close(); };
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  $("dDone").onclick = function () {
    const done = !markOf(current).done;
    const ok = updateMark({ done: done });
    $("dMsg").textContent = !ok ? SAVE_FAIL : done ? "Отмечено: урок проведён." : "Отметка снята.";
  };
  $("dNoteToggle").onclick = function () {
    const box = $("dNoteBox");
    box.hidden = !box.hidden;
    if (!box.hidden) { $("dNoteText").value = markOf(current).note || ""; $("dNoteText").focus(); }
  };
  $("dNoteSave").onclick = function () {
    const text = $("dNoteText").value.trim();
    const ok = updateMark({ note: text });
    $("dNoteBox").hidden = true;
    $("dMsg").textContent = !ok ? SAVE_FAIL : text ? (SHARED ? "Заметка сохранена." : "Заметка сохранена на этом устройстве.") : "Заметка удалена.";
  };

  // ---------- Шаг Б: общая Google-таблица ----------
  // Изменение сначала сохраняется на устройстве и встаёт в очередь,
  // потом отправляется в таблицу. Нет связи: отправится позже.
  const SHARED = /^https:\/\//i.test(SHEET_URL);
  const NAME_KEY = "sayt-uroki-imya", QUEUE_KEY = "sayt-uroki-ochered" + SUFFIX;
  let queue = {};
  try { queue = JSON.parse(localStorage.getItem(QUEUE_KEY)) || {}; } catch (e) { queue = {}; }
  function saveQueue() { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch (e) {} }

  function storedName() { try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; } }
  function askName() {
    const n = (window.prompt("Как вас зовут? Имя будет видно рядом с отметками и заметками.", storedName()) || "").trim().slice(0, 40);
    if (n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
    renderWho();
    return n;
  }
  function whoAmI(ask) { return storedName() || (ask ? askName() : ""); }
  function renderWho() {
    const n = storedName();
    $("whoBtn").textContent = n ? "Вы: " + n + " (изменить)" : "Указать имя";
  }
  $("whoBtn").onclick = askName;

  function applyServer(data) {
    const next = {};
    Object.keys(data || {}).forEach(function (id) {
      if ((id.indexOf("8.3|") === 0) !== IS83) return; // отметки другой программы
      const m = data[id];
      if (m && (m.done || m.note)) next[id] = { done: !!m.done, note: String(m.note || ""), who: String(m.who || ""), when: String(m.when || "") };
    });
    Object.keys(queue).forEach(function (id) {
      const q = queue[id];
      if (q.done || q.note) next[id] = { done: q.done, note: q.note, who: q.who, when: "" }; else delete next[id];
    });
    marks = next;
    saveMarks();
    refreshDialog();
    renderAll();
  }

  let syncing = false;
  function sync() {
    if (!SHARED || syncing) return;
    syncing = true;
    const sent = Object.keys(queue).map(function (id) {
      const q = queue[id];
      return { id: id, done: q.done, note: q.note, who: q.who, t: q.t };
    });
    const req = sent.length
      ? fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ changes: sent }) })
      : fetch(SHEET_URL);
    let again = false;
    req.then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.ok) throw new Error("bad answer");
      sent.forEach(function (c) { if (queue[c.id] && queue[c.id].t === c.t) delete queue[c.id]; });
      saveQueue();
      const rows = IS83 ? res.lessons83 : res.lessons;
      if (applyLessons(rows)) {
        try { localStorage.setItem(LESSONS_KEY, JSON.stringify(rows)); } catch (e) {}
      }
      applyServer(res.marks);
      const now = new Date();
      $("syncLine").textContent = "Отметки общие, обновлено в " + now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
      again = Object.keys(queue).length > 0;
    }).catch(function () {
      const waiting = Object.keys(queue).length > 0;
      const text = waiting
        ? "Нет связи. Изменения сохранены на этом устройстве и отправятся позже."
        : "Нет связи с общей таблицей. Показаны отметки с этого устройства.";
      $("syncLine").textContent = text;
      if (waiting && dlg.open) $("dMsg").textContent = text;
    }).then(function () {
      syncing = false;
      if (again) sync();
    });
  }
  if (SHARED) {
    $("syncBox").hidden = false;
    $("syncLine").textContent = "Загружаю общие отметки…";
    renderWho();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) sync(); });
    window.addEventListener("online", sync);
    setInterval(function () { if (!document.hidden) sync(); }, 60000);
  }

  function renderAll() {
    renderProgress();
    renderWeeks();
    renderDays();
    renderSchedule();
    renderSearch();
  }
  renderAll();
  sync();
</script>
</body>
</html>
