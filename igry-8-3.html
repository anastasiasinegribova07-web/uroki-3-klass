<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игры 8.3</title>
<style>
  :root {
    --bg: #f7f3ec; --card: #fffdf9; --ink: #2f2a25; --muted: #6f665c; --line: #e4dcd0;
    --rus: #a4573f; --mat: #46668a; --ok: #3f7d3a; --ok-soft: #e3f0df; --no: #b5652e; --no-soft: #f8e9dc;
    --hard: #3d6fb6; --soft: #3f8a4a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, "Helvetica Neue", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .back { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 15px; color: var(--ink); cursor: pointer; text-decoration: none; }
  .menu h2 { font-size: 15px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .menu a { display: block; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--rus); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; color: var(--ink); text-decoration: none; font-size: 18px; }
  .menu a.m { border-left-color: var(--mat); }
  .menu a small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px; text-align: center; }
  .progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .progress i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: inline-block; }
  .progress i.done { background: var(--ok); }
  .task { font-size: 18px; color: var(--muted); margin-bottom: 10px; }
  .big { font-size: 44px; font-weight: bold; letter-spacing: 2px; margin: 10px 0 18px; min-height: 56px; overflow-wrap: anywhere; }
  .big .gap { color: var(--rus); border-bottom: 3px solid var(--rus); padding: 0 6px; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btns button { min-width: 120px; min-height: 64px; font-size: 24px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; padding: 8px 18px; }
  .btns button.hard { border-color: var(--hard); color: var(--hard); }
  .btns button.soft { border-color: var(--soft); color: var(--soft); }
  .btns button:disabled { opacity: .45; cursor: default; }
  .msg { min-height: 64px; margin-top: 16px; font-size: 19px; border-radius: 12px; padding: 10px; }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .msg.no { background: var(--no-soft); color: var(--no); }
  .next { margin-top: 12px; font-size: 20px; padding: 12px 26px; border-radius: 12px; border: 0; background: var(--ok); color: #fff; cursor: pointer; }
  .final { font-size: 26px; margin: 10px 0; }
  svg.pic { width: 240px; height: 180px; display: block; margin: 0 auto 14px; }
  .rule { font-size: 15px; color: var(--muted); margin-top: 14px; }
  @media (max-width: 420px) { .big { font-size: 36px; } .btns button { min-width: 100px; font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ================= ИГРЫ ДЛЯ ПРОГРАММЫ 8.3 =================
// Каждая игра открывается по ссылке с #: igry-8-3.html#tm, #mz, #shi, #zg, #ugol, #minus, #figury, #vse, #skobki.
// 10 вопросов в игре. Без звуков и таймеров. Ошибка не наказывается: подсказка и ещё попытка.

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr, n) { return shuffle(arr).slice(0, n); }
function numOptions(right, lo, hi) {
  const s = new Set([right]);
  const near = shuffle([right - 1, right + 1, right - 2, right + 2]).filter(function (x) { return x >= lo && x <= hi; });
  near.forEach(function (x) { if (s.size < 3) s.add(x); });
  while (s.size < 3) s.add(rnd(lo, hi));
  return shuffle(Array.from(s)).map(String);
}

// ---------- Русский язык ----------
const TM_WORDS = [["мыло","т"],["мишка","м"],["нос","т"],["нёс","м"],["лук","т"],["люк","м"],["рад","т"],["ряд","м"],["был","т"],["бил","м"],["мак","т"],["мяч","м"],["дом","т"],["дятел","м"],["сок","т"],["сено","м"],["кот","т"],["кит","м"],["лапа","т"],["липа","м"],["Тома","т"],["Тёма","м"]];
const MZ_WORDS = [["кон_","ь","конь"],["пен_","ь","пень"],["дом_","—","дом"],["сад_","—","сад"],["пал_то","ь","пальто"],["угол_","ь","уголь"],["сол_","ь","соль"],["ден_","ь","день"],["кот_","—","кот"],["мак_","—","мак"],["огон_ки","ь","огоньки"],["сан_ки","—","санки"],["бан_ка","—","банка"],["кол_цо","ь","кольцо"],["окун_","ь","окунь"],["нос_","—","нос"],["руч_ка","—","ручка"],["апрел_","ь","апрель"]];
const SHI_WORDS = [["ж_раф","и","ы","жираф"],["ш_на","и","ы","шина"],["маш_на","и","ы","машина"],["ж_вот","и","ы","живот"],["лыж_","и","ы","лыжи"],["ч_шка","а","я","чашка"],["щ_вель","а","я","щавель"],["ч_йка","а","я","чайка"],["площ_дь","а","я","площадь"],["ч_сы","а","я","часы"],["ч_до","у","ю","чудо"],["щ_ка","у","ю","щука"],["ч_дак","у","ю","чудак"],["ищ_","у","ю","ищу"],["ч_гун","у","ю","чугун"]];
const SHI_RULE = { "и": "Жи и ши пиши с буквой и.", "а": "Ча и ща пиши с буквой а.", "у": "Чу и щу пиши с буквой у." };
const ZG_PAIRS = [["б","п"],["в","ф"],["г","к"],["д","т"],["ж","ш"],["з","с"]];

// ---------- Математика: углы и фигуры (рисунки) ----------
function angleSvg(deg, turn) {
  const cx = 120, cy = 90, r = 85;
  const a1 = turn * Math.PI / 180, a2 = (turn + deg) * Math.PI / 180;
  const x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
  const x2 = cx + r * Math.cos(a2), y2 = cy - r * Math.sin(a2);
  // сдвиг, чтобы угол помещался в рамку
  const xs = [cx, x1, x2], ys = [cy, y1, y2];
  const dx = 120 - (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
  const dy = 90 - (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
  return '<svg class="pic" viewBox="0 0 240 180"><g transform="translate(' + dx.toFixed(1) + ' ' + dy.toFixed(1) + ')">' +
    '<line x1="' + cx + '" y1="' + cy + '" x2="' + x1.toFixed(1) + '" y2="' + y1.toFixed(1) + '" stroke="#2f2a25" stroke-width="5" stroke-linecap="round"/>' +
    '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#2f2a25" stroke-width="5" stroke-linecap="round"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="#c0392b"/></g></svg>';
}
const SHAPES = [
  ["квадрат", true, '<rect x="70" y="40" width="100" height="100" fill="#cfe0f2" stroke="#46668a" stroke-width="4"/>'],
  ["прямоугольник", true, '<rect x="40" y="55" width="160" height="80" fill="#cfe0f2" stroke="#46668a" stroke-width="4"/>'],
  ["четырёхугольник", true, '<polygon points="50,140 80,45 200,60 180,150" fill="#cfe0f2" stroke="#46668a" stroke-width="4"/>'],
  ["четырёхугольник", true, '<polygon points="60,140 90,50 170,50 200,140" fill="#cfe0f2" stroke="#46668a" stroke-width="4"/>'],
  ["четырёхугольник", true, '<polygon points="120,25 200,90 120,155 40,90" fill="#cfe0f2" stroke="#46668a" stroke-width="4"/>'],
  ["треугольник", false, '<polygon points="120,30 200,150 40,150" fill="#f3dccf" stroke="#a4573f" stroke-width="4"/>'],
  ["треугольник", false, '<polygon points="50,40 50,150 200,150" fill="#f3dccf" stroke="#a4573f" stroke-width="4"/>'],
  ["круг", false, '<circle cx="120" cy="90" r="65" fill="#f3dccf" stroke="#a4573f" stroke-width="4"/>'],
  ["овал", false, '<ellipse cx="120" cy="90" rx="90" ry="55" fill="#f3dccf" stroke="#a4573f" stroke-width="4"/>'],
  ["пятиугольник", false, '<polygon points="120,25 195,80 165,155 75,155 45,80" fill="#f3dccf" stroke="#a4573f" stroke-width="4"/>'],
];

// ---------- Генераторы вопросов: {task, show (html), options, right, hint, okText, cls} ----------
const GAMES = {
  tm: { title: "Твёрдый или мягкий?", subj: "r", sub: "Первый согласный в слове", make: function () {
    return pick(TM_WORDS, 10).map(function (w) {
      const v = w[1] === "т" ? "твёрдый" : "мягкий";
      return { task: "Первый согласный звук — твёрдый или мягкий?", show: w[0], options: ["твёрдый", "мягкий"], cls: ["hard", "soft"], right: v,
        hint: "Посмотри, какая буква стоит после согласной: а, о, у, ы — твёрдый; я, ё, ю, е, и — мягкий.", okText: "Верно! В слове «" + w[0] + "» первый согласный " + v + "." };
    }); } },
  mz: { title: "Нужен ли мягкий знак?", subj: "r", sub: "ь на конце и в середине слова", make: function () {
    return pick(MZ_WORDS, 10).map(function (w) {
      return { task: "Вставь ь, если он нужен. Если не нужен — нажми «—».", show: w[0].replace("_", '<span class="gap">?</span>'), options: ["ь", "—"], right: w[1],
        hint: "Произнеси слово. Звук мягкий — пишем ь. Звук твёрдый — ь не нужен.", okText: "Верно! Пишем: " + w[2] + "." };
    }); } },
  shi: { title: "Жи-ши, ча-ща, чу-щу", subj: "r", sub: "Выбери нужную гласную", make: function () {
    return pick(SHI_WORDS, 10).map(function (w) {
      return { task: "Какую букву вставить?", show: w[0].replace("_", '<span class="gap">?</span>'), options: shuffle([w[1], w[2]]), right: w[1],
        hint: SHI_RULE[w[1]], okText: "Верно! " + w[3] + ". " + SHI_RULE[w[1]] };
    }); } },
  zg: { title: "Звонкий или глухой?", subj: "r", sub: "Найди пару согласному", make: function () {
    const all = [];
    ZG_PAIRS.forEach(function (p) { all.push([p[0], p[1], "звонкий"]); all.push([p[1], p[0], "глухой"]); });
    return pick(all, 10).map(function (q) {
      const others = shuffle(ZG_PAIRS.map(function (p) { return q[2] === "звонкий" ? p[1] : p[0]; }).filter(function (x) { return x !== q[1]; })).slice(0, 2);
      return { task: "Звук [" + q[0] + "] — " + q[2] + ". Найди его пару.", show: q[0], options: shuffle([q[1]].concat(others)), right: q[1],
        hint: "Пары: б — п, в — ф, г — к, д — т, ж — ш, з — с. Положи ладошку на горлышко и произнеси.", okText: "Верно! " + q[0] + " — " + q[1] + " — это пара." };
    }); } },
  ugol: { title: "Какой угол?", subj: "m", sub: "Прямой, острый, тупой", make: function () {
    const types = shuffle(["прямой","прямой","прямой","острый","острый","острый","тупой","тупой","тупой","прямой"]);
    return types.map(function (t) {
      const deg = t === "прямой" ? 90 : t === "острый" ? rnd(25, 60) : rnd(120, 150);
      const turn = [0, 90, 180, 270][rnd(0, 3)] + (t === "прямой" ? 0 : rnd(-10, 10));
      return { task: "Какой это угол?", show: angleSvg(deg, turn), raw: true, options: ["прямой", "острый", "тупой"], right: t,
        hint: "Приложи угольник. Как у угольника — прямой. Меньше — острый. Больше — тупой.", okText: "Верно! Это " + t + " угол." };
    }); } },
  minus: { title: "Вычитание с переходом", subj: "m", sub: "Из 11–18 через десяток", make: function () {
    const out = [];
    while (out.length < 10) {
      const a = rnd(11, 18), b = rnd(a - 9, 9);
      if (b <= a - 10 || b < 2) continue;
      const first = a - 10, rest = b - first;
      out.push({ task: "Реши пример.", show: a + " − " + b + " = ?", options: numOptions(a - b, 1, 9), right: String(a - b),
        hint: "Сначала до 10: " + a + " − " + first + " = 10. Потом остальное: 10 − " + rest + " = " + (10 - rest) + ".",
        okText: "Верно! " + a + " − " + first + " − " + rest + " = " + (a - b) + "." });
    }
    return out; } },
  figury: { title: "Найди четырёхугольник", subj: "m", sub: "Четыре угла, четыре стороны", make: function () {
    return shuffle(SHAPES).map(function (s) {
      return { task: "Это четырёхугольник?", show: '<svg class="pic" viewBox="0 0 240 180">' + s[2] + '</svg>', raw: true, options: ["да", "нет"], right: s[1] ? "да" : "нет",
        hint: "Посчитай углы и стороны. У четырёхугольника 4 угла и 4 стороны.", okText: "Верно! Это " + s[0] + (s[1] ? ": 4 угла, 4 стороны." : ", не четырёхугольник.") };
    }); } },
  vse: { title: "Плюс и минус", subj: "m", sub: "Сложение и вычитание до 20", make: function () {
    const out = [];
    while (out.length < 10) {
      if (Math.random() < 0.5) {
        const a = rnd(3, 9), b = rnd(11 - a, 9);
        out.push({ task: "Реши пример.", show: a + " + " + b + " = ?", options: numOptions(a + b, 10, 18), right: String(a + b),
          hint: "Дополни до 10: " + a + " + " + (10 - a) + " = 10, потом прибавь " + (b - (10 - a)) + ".", okText: "Верно! " + a + " + " + b + " = " + (a + b) + "." });
      } else {
        const a = rnd(11, 18), b = rnd(a - 9, 9);
        if (b <= a - 10 || b < 2) continue;
        out.push({ task: "Реши пример.", show: a + " − " + b + " = ?", options: numOptions(a - b, 1, 9), right: String(a - b),
          hint: "Сначала вычти до 10: " + a + " − " + (a - 10) + " = 10, потом вычти " + (b - (a - 10)) + ".", okText: "Верно! " + a + " − " + b + " = " + (a - b) + "." });
      }
    }
    return out; } },
  skobki: { title: "Сначала скобки", subj: "m", sub: "Порядок действий", make: function () {
    const out = [];
    while (out.length < 10) {
      const kind = rnd(0, 2);
      let text, inner, res, innerText;
      if (kind === 0) { const x = rnd(1, 5), y = rnd(1, 5), a = rnd(x + y, 10); inner = x + y; innerText = x + " + " + y; text = a + " − (" + innerText + ")"; res = a - inner; }
      else if (kind === 1) { const y = rnd(2, 7), a = rnd(3, 9); inner = 10 - y; innerText = "10 − " + y; text = a + " + (" + innerText + ")"; res = a + inner; }
      else { const y = rnd(1, 8), z = rnd(1, 10 - y); inner = y + z; innerText = y + " + " + z; const a = rnd(inner, 20); text = a + " − (" + innerText + ")"; res = a - inner; }
      out.push({ task: "Реши пример. Сначала действие в скобках.", show: text + " = ?", options: numOptions(res, 0, 20), right: String(res),
        hint: "Сначала скобки: " + innerText + " = " + inner + ".", okText: "Верно! В скобках " + inner + ", ответ " + res + "." });
    }
    return out; } },
};

// ---------- Экран ----------
const app = document.getElementById("app");
function menu() {
  document.title = "Игры 8.3";
  let html = '<header><h1>Игры к урокам · программа 8.3</h1></header><div class="menu"><h2>Русский язык</h2>';
  Object.keys(GAMES).forEach(function (k) { if (GAMES[k].subj === "r") html += '<a href="#' + k + '">' + GAMES[k].title + '<small>' + GAMES[k].sub + '</small></a>'; });
  html += '<h2>Математика</h2>';
  Object.keys(GAMES).forEach(function (k) { if (GAMES[k].subj === "m") html += '<a class="m" href="#' + k + '">' + GAMES[k].title + '<small>' + GAMES[k].sub + '</small></a>'; });
  html += '</div>';
  app.innerHTML = html;
}
function play(key) {
  const g = GAMES[key];
  document.title = g.title;
  const qs = g.make();
  let i = 0, firstTry = 0, tried = false;
  function render() {
    const q = qs[i];
    let dots = ""; for (let k = 0; k < qs.length; k++) dots += '<i class="' + (k < i ? "done" : "") + '"></i>';
    app.innerHTML = '<header><a class="back" href="#">← Все игры</a><h1>' + g.title + '</h1></header>' +
      '<div class="card"><div class="progress">' + dots + '</div><div class="task">' + q.task + '</div>' +
      '<div class="big">' + q.show + '</div><div class="btns"></div><div class="msg" aria-live="polite"></div></div>';
    const box = app.querySelector(".btns"), msg = app.querySelector(".msg");
    q.options.forEach(function (o, n) {
      const b = document.createElement("button");
      b.textContent = o;
      if (q.cls) b.className = q.cls[n];
      b.onclick = function () {
        if (o === q.right) {
          if (!tried) firstTry++;
          msg.className = "msg ok"; msg.textContent = q.okText;
          box.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
          const nx = document.createElement("button"); nx.className = "next";
          nx.textContent = i + 1 < qs.length ? "Дальше →" : "Готово";
          nx.onclick = function () { i++; tried = false; if (i < qs.length) render(); else finish(); };
          msg.appendChild(document.createElement("br")); msg.appendChild(nx); nx.focus();
        } else {
          tried = true; b.disabled = true;
          msg.className = "msg no"; msg.textContent = "Подумай ещё. " + q.hint;
        }
      };
      box.appendChild(b);
    });
  }
  function finish() {
    app.innerHTML = '<header><a class="back" href="#">← Все игры</a><h1>' + g.title + '</h1></header>' +
      '<div class="card"><div class="final">Молодец! Игра пройдена.</div><p style="font-size:20px">С первого раза: ' + firstTry + ' из ' + qs.length + '</p>' +
      '<button class="next" id="again">Сыграть ещё раз</button></div>';
    document.getElementById("again").onclick = function () { play(key); };
  }
  render();
}
function route() { const k = location.hash.replace("#", ""); if (GAMES[k]) play(k); else menu(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
